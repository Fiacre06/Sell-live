<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrine Boutique</title>

<style>
:root{
  --primary:#2e8b57;
  --secondary:#1f2937;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#374151;
  --muted:#6b7280;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
}

/* ================= LAYOUT ================= */
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* ================= HEADER ================= */
.header{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(135deg,var(--primary),#3cb371);
  color:white;
  padding:25px;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.header h2{
  margin:0;
  font-size:1.8rem;
}

/* ================= BUTTONS ================= */
button{
  border:none;
  border-radius:999px;
  padding:10px 18px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

#copyLinkBtn{
  background:white;
  color:var(--primary);
}

#copyLinkBtn:hover{
  transform:translateY(-2px);
  opacity:.9;
}

#visitSiteBtn{
  background:var(--primary);
  color:white;
  margin-top:10px;
}

#visitSiteBtn:hover{
  background:#246b45;
}

/* ================= OWNER ================= */
.owner{
  margin:20px 5px 10px;
  font-size:.95rem;
  color:var(--muted);
}

/* ================= INVITE ================= */
.site-invite{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:30px;
}

.site-invite p{
  margin:0;
  line-height:1.5;
}

/* ================= PRODUCTS ================= */
.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

/* ================= PRODUCT CARD ================= */
.productCard{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.productCard:hover{
  transform:translateY(-6px);
}

.productCard img{
  width:100%;
  height:170px;
  object-fit:cover;
}

.productCard h4{
  margin:12px 12px 5px;
  font-size:1.1rem;
}

.productCard p{
  margin:0 12px 10px;
  font-size:.9rem;
  color:var(--muted);
  flex-grow:1;
}

.productCard strong{
  margin:10px 12px 15px;
  font-size:1.05rem;
  color:var(--primary);
}

/* ================= RESPONSIVE ================= */
@media(max-width:600px){
  .header{
    text-align:center;
    justify-content:center;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2 id="shopName">Boutique</h2>
    <button id="copyLinkBtn">🔗 Copier le lien</button>
  </div>

  <div class="owner" id="shopOwner">Propriétaire : ...</div>

  <div class="site-invite">
    <p>
      Bienvenue dans notre boutique en ligne.  
      Découvrez nos produits sélectionnés avec soin et profitez des meilleures offres.
    </p>
    <button id="visitSiteBtn">🛒 Visiter le site principal</button>
  </div>

  <div class="products-grid" id="productsContainer"></div>

</div>

<script type="module">
import { supabase } from './supabase.js';

const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('id');
const shopNameEl = document.getElementById('shopName');
const shopOwnerEl = document.getElementById('shopOwner');
const productsContainer = document.getElementById('productsContainer');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const visitSiteBtn = document.getElementById('visitSiteBtn');

if (!shopId) {
  alert("ID de boutique manquant !");
  throw new Error("ID de boutique manquant");
}

copyLinkBtn.onclick = () => {
  navigator.clipboard.writeText(window.location.href)
    .then(() => alert("Lien copié !"))
    .catch(err => alert("Erreur copie lien : " + err));
};

visitSiteBtn.onclick = () => {
  window.location.href = "index.html";
};

async function loadShop() {
  const { data: shop, error } = await supabase
    .from('shops')
    .select('*')
    .eq('id', shopId)
    .single();

  if (error || !shop) {
    productsContainer.innerHTML = "<p style='color:red;'>Boutique introuvable</p>";
    return;
  }

  shopNameEl.textContent = shop.name || "Boutique";

  let ownerName = "Inconnu";
  if (shop.owner_id) {
    const { data: owner } = await supabase
      .from('profiles')
      .select('username')
      .eq('id', shop.owner_id)
      .single();
    if (owner) ownerName = owner.username;
  }
  shopOwnerEl.textContent = "Propriétaire : " + ownerName;

  const { data: products, error: prodError } = await supabase
    .from('shop_products')
    .select('*')
    .eq('shop_id', shopId)
    .order('created_at', { ascending: false });

  if (prodError || !products?.length) {
    productsContainer.innerHTML = "<p>Aucun produit disponible</p>";
    return;
  }

  products.forEach(p => {
    const div = document.createElement('div');
    div.className = 'productCard';
    div.innerHTML = `
      ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : ""}
      <h4>${p.name}</h4>
      <p>${p.description || ""}</p>
      <strong>${p.price} FCFA</strong>
    `;
    productsContainer.appendChild(div);
  });
}

loadShop();
</script>

</body>
</html>
